# ==============================================================================
# LLM Strategy Learner V2 - experiment configuration
# ==============================================================================
# What the model is told lives in prompts.toml. This file only defines the experiment.
# Unknown keys are errors, so a typo is caught at start-up.

[experiment]
output_dir = "output"
# Seeds match lengths and the Random opponent, so runs (and tiers) face the same matches.
# The LLM itself is not deterministic, even at low temperature.
seed = 42

[llm]
# Provider and model come from .env:
#   LLM_PROVIDER=openrouter | gemini | ollama | mock     (mock = offline, no API calls)
#   OPENROUTER_MODEL=...  GEMINI_MODEL=...  OLLAMA_MODEL=...
temperature = 0.2
# Attempts per call (parse errors, timeouts) before the fallback move is used.
max_retries = 3
# Stop the run (progress is checkpointed) after this many fallback moves in a row.
max_consecutive_fallbacks = 5

[llm.rate_limit]
max_rpm = 30
max_rpd = 1000

[environment]
# Probability that a chosen move is flipped. Keep 0.0 for the baseline experiment.
error_rate = 0.0

[prompts]
# Which information tier the model plays under (defined in prompts.toml):
#   t1_informed    opponent named + counter-strategy + exact match length
#   t2_named       opponent named and described, no counter-strategy
#   t3_pool_hint   opponent hidden, list of possible strategies shown
#   t4_blind       opponent hidden, no list
#   t5_open_ended  opponent hidden, no list, unknown match length
tier = "t3_pool_hint"
prompts_file = "prompts.toml"
# How many remembered entries (ranked by recency, importance, relevance) go into each prompt.
memory_top_k = 8

# ==============================================================================
# PHASE 1: TRAINING
# ==============================================================================
[training]
matches_per_strategy = 5
# Match length: an integer, { average, std_dev } for a bell curve,
# or { prob_end = 0.1 } for an unknown horizon (the match may end after any round).
rounds_per_match = { average = 10.0, std_dev = 1.0 }
# Strategies to train against, in order (see src/opponents.py for the available keys).
strategies = [
    "AlwaysCooperate",
    "AlwaysDefect",
    "TitForTat",
    "SuspiciousTitForTat",
    "TitForTwoTats",
    "TatForTit",
    "Random",
    "Detective",
]

[training.dreamer]
enabled = true
temperature = 0.2

# ==============================================================================
# PHASE 2: ROUND-ROBIN TOURNAMENT
# ==============================================================================
[evaluation]
enabled = true
matches_per_pairing = 5
rounds_per_match = { average = 10.0, std_dev = 1.0 }
# "LLMPlayer" is the trained model (frozen: it reads its memory and playbook but learns nothing new).
participants = [
    "LLMPlayer",
    "AlwaysCooperate",
    "AlwaysDefect",
    "TitForTat",
    "SuspiciousTitForTat",
    "TitForTwoTats",
    "TatForTit",
    "Random",
    "Detective",
]

[reporting]
export_html = true
export_markdown = true
export_json = true
